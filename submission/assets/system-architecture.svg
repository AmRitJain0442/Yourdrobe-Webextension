<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YourDrobe system architecture</title>
  <desc id="desc">Product data moves from supported retailer pages into a Chrome extension, through a FastAPI service on Cloud Run, to the Perfect Corp YouCam APIs. Profiles and outfits stay in browser storage, while the API key stays in Secret Manager.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b20"/>
      <stop offset="0.55" stop-color="#11143a"/>
      <stop offset="1" stop-color="#17113d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62a6ff"/>
      <stop offset="0.5" stop-color="#9c7cff"/>
      <stop offset="1" stop-color="#e7a6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#03040f" flood-opacity="0.52"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a98cff"/>
    </marker>
    <style>
      .eyebrow { font: 700 20px Arial, sans-serif; letter-spacing: 4px; fill: #8e9ad0; }
      .headline { font: 700 48px Arial, sans-serif; fill: #ffffff; }
      .section { font: 700 18px Arial, sans-serif; letter-spacing: 2px; fill: #a9b4e8; }
      .card-title { font: 700 25px Arial, sans-serif; fill: #ffffff; }
      .card-copy { font: 400 18px Arial, sans-serif; fill: #cbd2f3; }
      .small { font: 400 16px Arial, sans-serif; fill: #aab4dc; }
      .arrow-label { font: 400 13px Arial, sans-serif; fill: #aab4dc; }
      .pill { font: 700 15px Arial, sans-serif; fill: #f4f0ff; }
      .flow { fill: none; stroke: #a98cff; stroke-width: 4; marker-start: url(#arrow); marker-end: url(#arrow); }
      .local { fill: none; stroke: #67b9ff; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1460" cy="40" r="340" fill="#6f49ff" opacity="0.08"/>
  <circle cx="120" cy="880" r="300" fill="#2f90ff" opacity="0.07"/>

  <text x="80" y="74" class="eyebrow">YOURDROBE</text>
  <text x="80" y="130" class="headline">System architecture</text>
  <text x="80" y="170" class="card-copy">From a product listing to a layered virtual outfit</text>

  <text x="80" y="238" class="section">RETAILER</text>
  <text x="432" y="238" class="section">CHROME, ON THE SHOPPER'S DEVICE</text>
  <text x="990" y="238" class="section">HOSTED BACKEND</text>
  <text x="1320" y="238" class="section">TRY-ON</text>

  <g filter="url(#shadow)">
    <rect x="80" y="270" width="270" height="250" rx="28" fill="#151936" stroke="#343d72" stroke-width="2"/>
    <rect x="104" y="296" width="122" height="32" rx="16" fill="#263057"/>
    <text x="125" y="318" class="pill">SHOPPING</text>
    <text x="108" y="374" class="card-title">Retailer pages</text>
    <text x="108" y="416" class="card-copy">Amazon</text>
    <text x="108" y="449" class="card-copy">Flipkart</text>
    <text x="108" y="482" class="card-copy">Nykaa</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="270" width="460" height="250" rx="28" fill="#181b42" stroke="#6655ac" stroke-width="2"/>
    <rect x="454" y="296" width="168" height="32" rx="16" fill="url(#accent)"/>
    <text x="475" y="318" class="pill">SIDE PANEL</text>
    <text x="458" y="374" class="card-title">Chrome extension</text>
    <text x="458" y="416" class="card-copy">Reads visible product cards</text>
    <text x="458" y="449" class="card-copy">Handles selection and consent</text>
    <text x="458" y="482" class="card-copy">Shows previews and builds outfits</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="990" y="270" width="250" height="250" rx="28" fill="#181b42" stroke="#6655ac" stroke-width="2"/>
    <rect x="1014" y="296" width="146" height="32" rx="16" fill="#51449a"/>
    <text x="1035" y="318" class="pill">CLOUD RUN</text>
    <text x="1018" y="374" class="card-title">FastAPI service</text>
    <text x="1018" y="416" class="card-copy">Validates inputs</text>
    <text x="1018" y="449" class="card-copy">Routes product types</text>
    <text x="1018" y="482" class="card-copy">Polls and returns results</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1320" y="270" width="210" height="250" rx="28" fill="#1a173d" stroke="#8e68ca" stroke-width="2"/>
    <rect x="1344" y="296" width="158" height="32" rx="16" fill="#6c4ba8"/>
    <text x="1365" y="318" class="pill">YOUCAM API</text>
    <text x="1348" y="374" class="card-title">Perfect Corp</text>
    <text x="1348" y="416" class="card-copy">Clothes V3</text>
    <text x="1348" y="449" class="card-copy">Shoes</text>
    <text x="1348" y="482" class="card-copy">Hat</text>
  </g>

  <path d="M365 395 H415" class="flow"/>
  <path d="M905 395 H975" class="flow"/>
  <path d="M1255 395 H1305" class="flow"/>
  <text x="361" y="372" class="arrow-label">items / cart</text>
  <text x="896" y="372" class="arrow-label">request / result</text>
  <text x="1250" y="372" class="arrow-label">task / result</text>

  <g filter="url(#shadow)">
    <rect x="430" y="610" width="460" height="170" rx="28" fill="#121a3b" stroke="#2f83c7" stroke-width="2"/>
    <rect x="454" y="636" width="174" height="32" rx="16" fill="#245b89"/>
    <text x="475" y="658" class="pill">LOCAL STORAGE</text>
    <text x="458" y="714" class="card-title">Profile, outfits, preferences</text>
    <text x="458" y="754" class="card-copy">IndexedDB and chrome.storage.local</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="990" y="610" width="250" height="170" rx="28" fill="#171a3c" stroke="#5a63a9" stroke-width="2"/>
    <rect x="1014" y="636" width="190" height="32" rx="16" fill="#414b89"/>
    <text x="1035" y="658" class="pill">SECRET MANAGER</text>
    <text x="1018" y="714" class="card-title">YouCam API key</text>
    <text x="1018" y="754" class="card-copy">Never sent to Chrome</text>
  </g>

  <path d="M660 520 V600" class="local"/>
  <path d="M1115 600 V530" class="local"/>
  <text x="676" y="570" class="small">save locally</text>
  <text x="1134" y="570" class="small">read securely</text>

  <rect x="80" y="826" width="250" height="2" fill="url(#accent)"/>
  <text x="80" y="864" class="small">Photos are processed only after user consent.</text>
</svg>
